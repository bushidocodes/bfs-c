name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Build
        run: make

      - name: Test
        run: bash tests/run_tests.sh
